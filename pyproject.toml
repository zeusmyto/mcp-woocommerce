[project]
name = "mcp-woocommerce"
version = "1.0.0"
description = "MCP server that connects Claude to a WooCommerce shop (read-only by default)."
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "requests>=2.31"]

[project.scripts]
mcp-woocommerce = "mcp_woocommerce.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_woocommerce"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
